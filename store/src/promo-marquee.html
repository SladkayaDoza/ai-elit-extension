<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="store.css">
<style>
  body { width: 1400px; height: 560px; }
  .copy { position: absolute; left: 90px; top: 0; bottom: 0; width: 640px; display: flex; flex-direction: column; justify-content: center; gap: 24px; }
  .brand img { width: 64px; height: 64px; }
  .brand-name { font-size: 30px; }
  .headline { font-size: 48px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { font: 14px var(--mono); color: var(--text-dim); padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border-strong); background: rgba(28, 28, 31, 0.8); }
  .shot { position: absolute; right: 110px; top: 92px; width: 380px; height: 468px; overflow: hidden; border-radius: 12px 12px 0 0; border: 1px solid #34343a; border-bottom: none; box-shadow: 0 30px 80px rgba(0,0,0,0.6); }
  .shot img { width: 380px; display: block; }
  .bubble { position: absolute; right: 64px; top: 22px; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; background: #202124; border: 1px solid #3a3a3f; box-shadow: 0 16px 40px rgba(0,0,0,0.5); z-index: 2; }
  .bubble .ext-icon { width: 30px; height: 30px; }
  .bubble .ext-icon img { width: 30px; height: 30px; }
  .bubble .badge { min-width: 30px; height: 20px; font-size: 13px; line-height: 20px; right: -14px; bottom: -8px; }
  .bubble span.t { font: 13px var(--sans); color: var(--text-dim); margin-left: 14px; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="../../icons/icon128.png" alt=""><span class="brand-name"><span class="star">✦</span>AI ELIT Solver</span></div>
    <h1 class="headline">AI answers for tests, <em>in one click</em></h1>
    <div class="chips">
      <span class="chip">Fable 5.2</span><span class="chip">Opus 5.5</span><span class="chip">Sonnet 5.5</span>
      <span class="chip">stealth mode</span><span class="chip">free fallback</span>
    </div>
  </div>
  <div class="bubble"><span class="ext-icon"><img src="../../icons/icon128.png" alt=""><span class="badge">134</span></span><span class="t">correct: 1, 3, 4</span></div>
  <div class="shot"><img src=".build/popup-main.png" alt=""></div>
</body>
</html>
