<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="store.css">
<style>
  body { width: 440px; height: 280px; display: flex; align-items: center; gap: 26px; padding: 0 34px; }
  .icon { position: relative; width: 112px; height: 112px; flex-shrink: 0; }
  .icon img { width: 112px; height: 112px; }
  .icon .badge { right: -10px; bottom: 4px; min-width: 44px; height: 28px; font-size: 18px; line-height: 28px; border-radius: 7px; box-shadow: 0 0 0 3px #111113; }
  .title { font-family: var(--mono); font-size: 24px; font-weight: 700; line-height: 1.2; }
  .title .star { color: var(--accent); }
  .tag { margin-top: 10px; font-size: 16px; line-height: 1.4; color: var(--text-dim); }
  .tag em { font-style: normal; color: var(--accent); }
</style>
</head>
<body>
  <div class="icon"><img src="../../icons/icon128.png" alt=""><span class="badge">134</span></div>
  <div>
    <div class="title"><span class="star">✦</span> AI ELIT<br>Solver</div>
    <div class="tag">AI answers for tests<br><em>in one click</em></div>
  </div>
</body>
</html>
