<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI ELIT Solver</title>
  <style>
    :root {
      --bg: #101012;
      --surface: #161618;
      --raised: #1c1c1f;
      --border: #2a2a2e;
      --border-soft: #232327;
      --border-strong: #3c3c41;
      --text: #f5f4f0;
      --text-dim: #d3d0c9;
      --text-faint: #a5a198;
      --accent: #d7a35f;
      --accent-soft: rgba(215, 163, 95, 0.12);
      --error: #e07a7a;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 400px;
      min-height: 520px;
      max-height: 600px;
      overflow-y: auto;
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, 'Cascadia Mono', 'JetBrains Mono', Consolas, monospace;
      font-size: 12px;
      line-height: 1.55;
      padding: 16px;
    }

    /* ─── Header ─── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      border-bottom: 1px dashed var(--border);
      padding-bottom: 12px;
    }

    .logo {
      font-size: 18px;
      line-height: 1;
      color: var(--accent);
    }

    .header-text h1 {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.02em;
    }

    .header-text p {
      font-size: 10px;
      color: var(--text-faint);
      margin-top: 1px;
    }

    .header-right {
      margin-left: auto;
    }

    .gear-btn {
      background: none;
      border: 1px dashed var(--border);
      border-radius: 6px;
      color: var(--text-faint);
      font-size: 14px;
      cursor: pointer;
      padding: 5px 9px;
      transition: color 0.15s, border-color 0.15s;
      line-height: 1;
      font-family: inherit;
    }

    .gear-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    /* ─── Tabs ─── */
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 16px;
      border-bottom: 1px dashed var(--border);
    }

    .tab-btn {
      padding: 7px 10px;
      background: transparent;
      border: none;
      border-bottom: 1px solid transparent;
      margin-bottom: -1px;
      color: var(--text-faint);
      font-size: 11px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .tab-btn:hover {
      color: var(--text-dim);
    }

    .tab-btn.active {
      color: var(--accent);
      border-bottom: 1px solid var(--accent);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* ─── Form fields ─── */
    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-faint);
      margin-bottom: 5px;
    }

    input,
    select {
      width: 100%;
      padding: 7px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus,
    select:focus {
      border-color: var(--accent);
    }

    input::placeholder {
      color: #8f8b83;
    }

    input[type="password"] {
      letter-spacing: 0.1em;
    }

    select option {
      background: var(--surface);
      color: var(--text);
    }

    .toggle-key {
      position: relative;
    }

    .toggle-key input {
      padding-right: 34px;
    }

    .eye-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-faint);
      font-size: 13px;
      padding: 0;
      line-height: 1;
      transition: color 0.15s;
    }

    .eye-btn:hover {
      color: var(--text);
    }

    .hint {
      font-size: 10px;
      color: var(--text-faint);
      margin-top: 6px;
      line-height: 1.5;
    }

    .hint a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px dashed var(--accent);
    }

    .hint a:hover {
      color: var(--text);
      border-bottom-color: var(--text);
    }

    /* ─── Toggle switch ─── */
    .toggle-field {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
      margin-bottom: 4px;
      padding: 9px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .toggle-field label {
      margin-bottom: 0;
      font-size: 11px;
      text-transform: none;
      letter-spacing: 0;
      color: var(--text-dim);
    }

    .toggle-switch {
      position: relative;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: var(--border);
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .slider::before {
      content: '';
      position: absolute;
      left: 3px;
      top: 3px;
      width: 14px;
      height: 14px;
      background: var(--text-faint);
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }

    .toggle-switch input:checked+.slider {
      background: var(--accent-soft);
    }

    .toggle-switch input:checked+.slider::before {
      transform: translateX(16px);
      background: var(--accent);
    }

    .toggle-hint {
      font-size: 10px;
      color: var(--text-faint);
      text-align: center;
      margin-top: 2px;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    /* ─── Buttons ─── */
    .save-btn {
      width: 100%;
      padding: 8px;
      background: var(--accent);
      color: #17130d;
      border: 1px solid var(--accent);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      margin-top: 4px;
      transition: filter 0.15s;
      font-family: inherit;
    }

    .save-btn:hover {
      filter: brightness(1.1);
    }

    .btn-sm {
      padding: 6px 12px;
      background: transparent;
      color: var(--text-dim);
      border: 1px dashed var(--border-strong);
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
      font-family: inherit;
    }

    .btn-sm:hover {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .btn-sm.danger {
      color: var(--error);
    }

    .btn-sm.danger:hover {
      border-color: var(--error);
      background: rgba(224, 122, 122, 0.08);
    }

    .status {
      text-align: center;
      font-size: 11px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed var(--border-soft);
      min-height: 26px;
      color: var(--accent);
      transition: opacity 0.3s;
    }

    .status:empty {
      border-top-color: transparent;
    }

    .status.error {
      color: var(--error);
    }

    /* ─── Models Tab ─── */
    .model-list {
      max-height: 380px;
      overflow-y: auto;
      margin-bottom: 10px;
    }

    .model-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 4px;
      transition: border-color 0.15s;
    }

    .model-item:hover {
      border-color: var(--border-strong);
    }

    .model-info {
      flex: 1;
      min-width: 0;
    }

    .model-name {
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .model-id {
      font-size: 10px;
      color: var(--text-faint);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge {
      font-size: 9px;
      padding: 2px 7px;
      border-radius: 4px;
      background: transparent;
      color: var(--accent);
      border: 1px dashed var(--accent);
      flex-shrink: 0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .delete-model-btn {
      background: none;
      border: none;
      color: var(--text-faint);
      cursor: pointer;
      font-size: 13px;
      padding: 2px 4px;
      line-height: 1;
      transition: color 0.15s;
      flex-shrink: 0;
    }

    .delete-model-btn:hover {
      color: var(--error);
    }

    .add-model-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .add-model-row input {
      flex: 1;
      min-width: 0;
    }

    /* ─── Profiles Tab ─── */
    .profile-selector {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .profile-chip {
      padding: 5px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
      color: var(--text-dim);
      font-family: inherit;
    }

    .profile-chip:hover {
      border-color: var(--border-strong);
      color: var(--text);
    }

    .profile-chip.active {
      background: var(--accent-soft);
      border: 1px solid var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    .profile-chip .chip-icon {
      margin-right: 4px;
    }

    .profile-actions {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }

    .assignment-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 6px;
    }

    .assignment-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .assignment-label .a-icon {
      font-size: 13px;
    }

    .assignment-row {
      display: flex;
      gap: 6px;
    }

    .assignment-row select {
      padding: 6px 8px;
      font-size: 11px;
    }

    .assignment-row .model-select {
      flex: 2;
      min-width: 0;
    }

    .assignment-row .reasoning-select {
      flex: 1;
      min-width: 80px;
    }

    /* ─── New profile form ─── */
    .new-profile-form {
      display: none;
      margin-bottom: 10px;
      padding: 10px;
      background: var(--surface);
      border: 1px dashed var(--border-strong);
      border-radius: 8px;
    }

    .new-profile-form.visible {
      display: block;
    }

    .new-profile-row {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }

    .new-profile-row input {
      min-width: 0;
    }

    .icon-input {
      width: 44px !important;
      flex-shrink: 0;
      text-align: center;
      font-size: 15px !important;
    }

    /* ─── Modal ─── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 12, 0.72);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.visible {
      display: flex;
    }

    .modal {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      width: 340px;
      max-width: 95%;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }

    .modal h2 {
      font-size: 13px;
      color: var(--text);
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px dashed var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }

    .modal-btn {
      width: 100%;
      padding: 9px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    .modal-btn .m-icon {
      font-size: 15px;
    }

    .modal-close {
      margin-top: 2px;
      width: 100%;
      padding: 8px;
      background: transparent;
      border: 1px dashed var(--border-strong);
      border-radius: 6px;
      color: var(--text-faint);
      font-size: 12px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
      font-family: inherit;
    }

    .modal-close:hover {
      color: var(--text);
      border-color: var(--text-faint);
    }

    .modal-version {
      text-align: center;
      font-size: 10px;
      color: var(--text-faint);
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed var(--border-soft);
    }

    /* ─── Scrollbar ─── */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #4a4a50;
    }

    /* ─── Focus visibility ─── */
    button:focus-visible,
    a:focus-visible {
      outline: 1px solid var(--accent);
      outline-offset: 2px;
    }

    /* hidden file input */
    #importFileInput {
      display: none;
    }
  </style>
</head>

<body>

  <!-- Header -->
  <div class="header">
    <div class="logo">✦</div>
    <div class="header-text">
      <h1>AI ELIT Solver</h1>
      <p>Powered by OpenRouter</p>
    </div>
    <div class="header-right">
      <button class="gear-btn" id="gearBtn" title="Settings" aria-label="Settings">⚙</button>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="main">Main</button>
    <button class="tab-btn" data-tab="models">Models</button>
    <button class="tab-btn" data-tab="profiles">Profiles</button>
  </div>

  <!-- ══════════ TAB: Main ══════════ -->
  <div class="tab-content active" id="tab-main">
    <div class="field">
      <label>OpenRouter API Key</label>
      <div class="toggle-key">
        <input type="password" id="apiKey" placeholder="sk-or-v1-…" autocomplete="off">
        <button class="eye-btn" id="toggleKey" title="Show/Hide" aria-label="Show or hide key">👁</button>
      </div>
      <p class="hint">
        Get a free key at <a href="https://openrouter.ai/keys" target="_blank">openrouter.ai/keys</a>
      </p>
    </div>

    <div class="field">
      <label>Active Profile</label>
      <select id="activeProfile"></select>
    </div>

    <button class="save-btn" id="saveBtn">Save Settings</button>

    <div class="toggle-field">
      <label for="hideButton">Hide "Answer with AI" button</label>
      <label class="toggle-switch">
        <input type="checkbox" id="hideButton">
        <span class="slider"></span>
      </label>
    </div>
    <p class="toggle-hint">Button hidden, but <b>\</b> hotkey still works</p>

    <div class="toggle-field">
      <label for="debugMode">Debug mode (log prompts to console)</label>
      <label class="toggle-switch">
        <input type="checkbox" id="debugMode">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <!-- ══════════ TAB: Models ══════════ -->
  <div class="tab-content" id="tab-models">
    <div class="model-list" id="modelList"></div>

    <div class="add-model-row">
      <input type="text" id="newModelId" placeholder="provider/model-name">
      <input type="text" id="newModelName" placeholder="Display name">
      <button class="btn-sm" id="addModelBtn">+ Add</button>
    </div>
    <p class="hint" style="margin-top:6px">Enter an OpenRouter model ID and a display name</p>
  </div>

  <!-- ══════════ TAB: Profiles ══════════ -->
  <div class="tab-content" id="tab-profiles">
    <div class="profile-selector" id="profileSelector"></div>

    <div class="profile-actions">
      <button class="btn-sm" id="newProfileBtn">+ New Profile</button>
      <button class="btn-sm danger" id="deleteProfileBtn">Delete</button>
    </div>

    <div class="new-profile-form" id="newProfileForm">
      <label>Create New Profile</label>
      <div class="new-profile-row">
        <input type="text" class="icon-input" id="newProfileIcon" placeholder="⚡" maxlength="2">
        <input type="text" id="newProfileName" placeholder="Profile name">
        <button class="btn-sm" id="createProfileBtn">Create</button>
      </div>
    </div>

    <div id="assignmentsContainer"></div>
  </div>

  <!-- Status -->
  <div class="status" id="status" aria-live="polite"></div>

  <!-- ══════════ Settings Modal ══════════ -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <h2>⚙ Settings</h2>
      <div class="modal-actions">
        <button class="modal-btn" id="exportBtn">
          <span class="m-icon">📤</span> Export Config
        </button>
        <button class="modal-btn" id="importBtn">
          <span class="m-icon">📥</span> Import Config
        </button>
      </div>
      <input type="file" id="importFileInput" accept=".json">
      <button class="modal-close" id="closeModalBtn">Close</button>
      <p class="modal-version">AI ELIT Solver v1.4.4</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
